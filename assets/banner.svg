<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0f172a; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
    </linearGradient>
    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.0" />
    </linearGradient>
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>
  </defs>

  <style>
    .orb-float-1 {
      animation: floatLeft 12s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatRight 15s ease-in-out infinite alternate;
    }
    .grid-pulse {
      animation: pulseGrid 8s ease-in-out infinite;
    }
    .card-drift-1 {
      animation: cardMove1 9s ease-in-out infinite alternate;
    }
    .card-drift-2 {
      animation: cardMove2 11s ease-in-out infinite alternate;
    }
    .card-drift-3 {
      animation: cardMove3 10s ease-in-out infinite alternate;
    }
    .badge-shimmer {
      animation: shimmer 4s ease-in-out infinite alternate;
    }

    @keyframes floatLeft {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(60px, 40px) scale(1.15); }
    }
    @keyframes floatRight {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-70px, -30px) scale(1.2); }
    }
    @keyframes pulseGrid {
      0%, 100% { opacity: 0.12; }
      50% { opacity: 0.25; }
    }
    @keyframes cardMove1 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-14px); }
    }
    @keyframes cardMove2 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(16px); }
    }
    @keyframes cardMove3 {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-12px); }
    }
    @keyframes shimmer {
      0% { opacity: 0.85; filter: drop-shadow(0 0 6px rgba(56,189,248,0.3)); }
      100% { opacity: 1; filter: drop-shadow(0 0 16px rgba(168,85,247,0.6)); }
    }
  </style>

  <!-- Deep Background Layer -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />

  <!-- Animated Glowing Ambient Orbs (Background) -->
  <g filter="url(#blurFilter)">
    <circle cx="150" cy="100" r="140" fill="url(#glowGrad1)" class="orb-float-1" />
    <circle cx="1050" cy="260" r="170" fill="url(#glowGrad2)" class="orb-float-2" />
    <circle cx="600" cy="40" r="100" fill="#6366f1" opacity="0.15" />
  </g>

  <!-- High-Tech Isometric Grid Accent -->
  <g class="grid-pulse" stroke="#94a3b8" stroke-width="0.8" stroke-dasharray="4,6">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
  </g>

  <!-- Dynamic Floating Feature Pills in Midground (Off to sides / lower to avoid title overlap) -->
  <g class="card-drift-1" opacity="0.85">
    <rect x="75" y="245" width="220" height="42" rx="21" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="100" cy="266" r="6" fill="#38bdf8" />
    <text x="116" y="272" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">🚀 Modern Headless CMS</text>
  </g>

  <g class="card-drift-2" opacity="0.85">
    <rect x="910" y="70" width="215" height="42" rx="21" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="935" cy="91" r="6" fill="#a855f7" />
    <text x="951" y="97" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">🎨 Visual Site Builders</text>
  </g>

  <g class="card-drift-3" opacity="0.85">
    <rect x="910" y="245" width="215" height="42" rx="21" fill="url(#cardGrad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="935" cy="266" r="6" fill="#34d399" />
    <text x="951" y="272" fill="#e2e8f0" font-size="13" font-weight="600" letter-spacing="0.5">⚡ Open-Source &amp; SaaS</text>
  </g>

  <!-- FOREGROUND: Clean, Bold, High-Contrast Typography & Hierarchy -->
  <g text-anchor="middle">
    <!-- Top Pill Badge -->
    <g class="badge-shimmer">
      <rect x="475" y="44" width="250" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
      <circle cx="495" cy="60" r="5" fill="#38bdf8" />
      <text x="606" y="65" fill="#7dd3fc" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
    </g>

    <!-- Main Title (Gradient) -->
    <text x="600" y="145" fill="url(#textGrad)" font-size="44" font-weight="900" letter-spacing="-1">
      Awesome Website Builder &amp; CMS
    </text>

    <!-- Subtitle (Crisp Slate White) -->
    <text x="600" y="195" fill="#e2e8f0" font-size="19" font-weight="500" letter-spacing="0.2">
      The Ultimate Guide to Visual Site Builders, Headless Systems &amp; Self-Hosted Platforms
    </text>

    <!-- Meta Description Pill -->
    <text x="600" y="232" fill="#94a3b8" font-size="14" font-weight="400">
      ⚡ Comprehensive Market Dynamics • Free-Tier Limits • Live GitHub Stars • Pricing Comparison
    </text>
  </g>
</svg>
